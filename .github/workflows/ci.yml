# Native Linux validation with the shared edbfi CI gate.
name: CI
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: "22 5 * * 0" }]   # weekly main revalidation; minute unique per repo
permissions: {}
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install pinned stable toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with: { extra-args: "--all-files --hook-stage manual" }
      - name: Build native release
        run: cargo build --release --locked
      - name: Smoke test without game files
        run: |
          target/release/icarus-server check-config --config config/server.example.toml
          target/release/icarus-server run --data-dir work/ci-smoke --max-ticks 3
  ci-ok:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ""
        run: |
          jq -e --arg skips "$ALLOWED_SKIPS" '
            ($skips | split(",") | map(select(. != ""))) as $allowed
            | length > 0 and all(to_entries[]; .value.result == "success"
                or (.value.result == "skipped" and (.key | IN($allowed[]))))
          ' <<<"$NEEDS" >/dev/null || { echo "::error::ci-ok failed: $(jq -c 'map_values(.result)' <<<"$NEEDS")"; exit 1; }
