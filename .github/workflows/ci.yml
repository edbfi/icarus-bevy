name: Native Linux checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned stable toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test headless behavior and persistence
        run: cargo test --workspace --all-targets --locked
      - name: Build native release
        run: cargo build --release --locked
      - name: Smoke test without game files
        run: |
          target/release/icarus-server check-config --config config/server.example.toml
          target/release/icarus-server run --data-dir work/ci-smoke --max-ticks 3
