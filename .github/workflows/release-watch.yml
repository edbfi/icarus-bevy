# SPDX-License-Identifier: AGPL-3.0-only
# Opens one issue per build when Steam's public dedicated-server build moves past
# config/release.toml (docs/architecture.md, "Release tracking"), and closes open
# release-watch issues whose build has been pinned or superseded. Reads anonymous
# app info only; nothing is downloaded or pinned here.
name: Release watch
on:
  schedule: [{ cron: "41 7 * * *" }]   # daily; ICARUS releases land on Thursday evenings UTC
  workflow_dispatch:
permissions: {}
concurrency: { group: release-watch, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15.0"
          activate-environment: true
          no-project: true
          enable-cache: false
      - name: Install SteamCMD
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lib32gcc-s1
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$RUNNER_TEMP/steamcmd"
      - name: Compare the public build with the pin
        id: check
        run: |
          set +e
          python tools/release_watch.py check --steamcmd "$RUNNER_TEMP/steamcmd/steamcmd.sh" > result.json
          status=$?
          set -e
          cat result.json
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
          echo "behind=$([ "$status" -eq 3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Reconcile release issues
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          pinned="$(python -c 'import json; print(json.load(open("result.json"))["pinned_build"])')"
          live="$(python -c 'import json; print(json.load(open("result.json"))["live_build"])')"
          behind="$(python -c 'import json; print("true" if json.load(open("result.json"))["behind"] else "false")')"
          prefix="Official release moved: build "
          gh issue list --state open --search "in:title \"$prefix\"" --json number,title |
            python -c '
          import json, re, subprocess, sys
          pinned, live, behind = int(sys.argv[1]), int(sys.argv[2]), sys.argv[3] == "true"
          for issue in json.load(sys.stdin):
              m = re.fullmatch(r"Official release moved: build ([0-9]+)", issue["title"])
              if m is None:
                  continue
              build = int(m[1])
              if not behind and build == pinned:
                  reason = f"Closed automatically: config/release.toml is now pinned to build {pinned}."
              elif build <= pinned and build != live:
                  reason = f"Closed automatically: config/release.toml has moved to build {pinned}."
              elif behind and build != live:
                  reason = f"Closed automatically: superseded by live Steam public build {live}."
              else:
                  continue
              subprocess.run(["gh", "issue", "close", str(issue["number"]), "--comment", reason], check=True)
          ' "$pinned" "$live" "$behind"
          if [ "$behind" = "true" ]; then
            title="Official release moved: build $live"
            {
              echo "Steam public build $live differs from config/release.toml:"
              echo
              cat result.json
              echo
              echo "Fetch the build, run tools/release_watch.py pin --install DIR, then qualify the bump"
              echo "(docs/architecture.md, Release tracking)."
            } > body.md
            existing="$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
            if [ -z "$existing" ]; then gh issue create --title "$title" --body-file body.md; else echo "issue #$existing already tracks build $live"; fi
          fi
