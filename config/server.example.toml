# Development foundation only: ICARUS protocol and gameplay are not implemented.
data_dir = "work/runtime"
# Provisional local simulation rate; not a claim about ICARUS's tick rate.
tick_hz = 30
max_catch_up_ticks = 4
autosave_seconds = 60
shutdown_timeout_seconds = 10
status_interval_seconds = 10

# EXPERIMENTAL session layer; disabled by default. Omit [network.hosting] for
# the loopback peer lab. Authenticated public hosting is explicit and bounded;
# protocol/gameplay compatibility remains unproven.
[network]
enabled = false
bind = "127.0.0.1"
port = 17777
max_players = 8
# Native inbound-idle / outstanding-delivery-progress timeout; removal is local.
session_timeout_seconds = 30

# OPTIONAL authored server-owned checkpoints, schema-14 stores only.
# Requires release_profile, data_pak, authored_gameplay and authored_world.
# Online use also requires authenticated hosting with the exact same context.
# Reopening retains this table and the same authored inputs; a new game
# release does not refuse the store (docs/architecture.md, "Persistence").
# Controller/GameState/PlayerState precede the deferred pawn in this mode;
# continuation under that order is unqualified with stock clients. Health and
# position edits have a library API only, with no runtime caller or operator UI.
# [network.player_persistence]
# prospect_id = "stable-authored-workshop"
# map_url = "/Authored/Maps/Workshop"
# prospect_row = "AuthoredProspect"
# difficulty = 2

# OPTIONAL independent vital consumption, requires player_persistence above.
# Integer units per simulated second, 0..10,000,000; at least one positive.
# Rates and tick_hz bind the saved recipe; changing either refuses reopen.
# [network.player_consumption]
# oxygen = 1
# water = 1
# food = 1

# EXPERIMENTAL: where joining players' pawns and controllers open, in
# centimetres (Unreal axes, Z up), round-robin by join; at most 64 points, each
# component within +-1,048,576 cm; yaw (degrees, within one turn) is checked
# but not sent. Omit the table to keep the origin. Take positions from your own
# knowledge of the map or a player's own save: the server ships no map data, and
# a point below the client's terrain falls forever. Needs release_profile.
# [network.spawn]
# points = [
#   { x = 0.0, y = 0.0, z = 0.0, yaw = 0.0 },
# ]

# OPTIONAL uniform authored clock; requires the schema-14 player feature above.
# First configure the required [network.authored_world] parent; see
# docs/runbooks/authored-worlds.md and docs/runbooks/authored-survival.md.
# Reopen with the same recipe; tick_hz must equal the global server tick_hz.
# Offline ticks advance phase; stopped-server time does not. No daylight claim.
# [network.authored_world.clock]
# initial_minute = 480
# seconds_per_day = 3600
# tick_hz = 30

# Optional bounded Steam-authenticated production hosting. Requires enabled
# networking, explicit game/query ports, release_profile, data_pak,
# authored_gameplay and [network.authored_world]. Simulation must run in real
# time. Preserved prospects are refused until saved-map binding is qualified.
# These are independently authored example identities, not playable map data.
# A2S exposes counts; Steam CM receives accepted joined Steam IDs, not save data.
# [network.hosting]
# query_bind = "0.0.0.0"
# query_port = 27015
# private_ip = "192.0.2.1" # documentation-only; replace with the host address
# seconds = 3600 # 1..=86400; finite authentication budget also applies
# name = "Authored workshop"
# map_url = "/Authored/Maps/Workshop"
# prospect_id = "stable-authored-workshop"
# prospect_row = "AuthoredProspect" # must exist in the configured protocol catalog
# lobby_name = "Workshop"
# difficulty = 2
