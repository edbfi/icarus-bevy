[package]
name = "icarus-bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
description = "Independent native Linux dedicated-server research and Bevy foundation"
publish = false

[[bin]]
name = "icarus-server"
path = "src/main.rs"

[[bin]]
name = "icarus-fetch"
path = "src/bin/icarus-fetch.rs"

[dependencies]
aes = "0.9.3"
anyhow = "1"
base64 = "0.23.1"
bevy = { version = "=0.20.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_state", "bevy_log"] }
cbc = { version = "0.2.1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5.2"
ctrlc = { version = "3", features = ["termination"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.3"
hmac = "0.13.0"
lzma-rs = "0.3.0"
prost = "0.14.4"
rustix = { version = "1.1.5", features = ["fs"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sha1 = "0.11.0"
tempfile = "3"
toml = "1.1.8"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
# Line tables keep backtrace locations; full debug info made each of the ~40
# test binaries about 130 MiB.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
