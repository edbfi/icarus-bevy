[package]
name = "icarus-bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
description = "Independent native Linux dedicated-server research and Bevy foundation"
publish = false

[[bin]]
name = "icarus-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22.1"
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_state", "bevy_log"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.3"
hmac = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10.6"
tempfile = "3"
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
