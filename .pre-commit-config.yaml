# Based on https://github.com/edbfi/edbfi-ci/blob/main/.pre-commit-config.yaml.
# Full check: prek run --all-files --hook-stage manual
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, manual]

# Preserve upstream skill snapshots and keep analysis artifacts out of checks.
exclude: ^(\.agents/(skills|vendor)/|icarus-orig/|work/|target/)

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Local only: this scans the staged diff, not --all-files.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor

  # Shared edbfi CI policy hooks
  - repo: https://github.com/edbfi/edbfi-ci
    rev: d07ccc13141d4aee4fa28546f4328f4e48d5363b  # frozen: v0.1.0
    hooks:
      - id: privileged-jobs

  - repo: local
    hooks:
      - id: research-scope-tests
        name: Test offline research scope boundaries
        entry: node --test tools/tests/research-scope.test.cjs
        language: system
        pass_filenames: false
        files: ^tools/(research-scope\.cjs|tests/research-scope\.test\.cjs)$
      - id: pe-candidate-tests
        name: Test PE caller candidate bounds
        entry: node --test tools/tests/pe_candidates.test.cjs tools/tests/pe_candidates_independent.test.cjs
        language: system
        pass_filenames: false
        files: ^tools/(pe_candidates\.cjs|tests/pe_candidates.*\.cjs)$
      - id: pdb-public-symbol-tests
        name: Test bounded PDB public symbol reader
        entry: node --test tools/tests/pdb_public_symbols.test.cjs tools/tests/pdb_public_symbols_review.test.cjs
        language: system
        pass_filenames: false
        files: ^tools/(pdb_public_symbols\.cjs|tests/pdb_public_symbols.*\.cjs)$
      - id: python-typing-config
        name: Check Python typing policy
        entry: python3 tools/typing_gate.py
        language: system
        pass_filenames: false
        files: (\.py$|(^|/)(pyproject\.toml|pyrightconfig\.json)$|^\.basedpyright/)
      - id: basedpyright
        name: Type-check authored Python (warnings are failures)
        entry: uvx basedpyright@latest --warnings
        language: system
        pass_filenames: false
        files: (\.pyi?$|^pyproject\.toml$|^\.python-version$)
      - id: research-helper-tests
        name: Test authored research fixtures
        entry: python3 -m unittest discover -s tools/tests -v
        language: system
        pass_filenames: false
        files: ^tools/.*\.py$
      - id: docs-lint
        name: Lint documentation surface (caps, headings, links, ledger IDs)
        entry: python3 tools/docs_lint.py
        language: system
        pass_filenames: false
        files: (\.md$|^evidence/|^tools/docs_lint\.py$|^src/.*\.rs$|^tools/|^\.github/)
      - id: cargo-fmt
        name: Check Rust formatting
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: (\.rs$|(^|/)Cargo\.toml$|(^|/)(\.rustfmt|rustfmt)\.toml$)
      - id: cargo-clippy
        name: Lint Rust targets
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        pass_filenames: false
        files: (\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain(\.toml)?$|^\.cargo/.*\.toml$)
      - id: cargo-test
        name: Test Rust targets
        entry: cargo test --workspace --all-targets --locked
        language: system
        pass_filenames: false
        files: (\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain(\.toml)?$|^\.cargo/.*\.toml$)
        stages: [pre-push, manual]
